[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notice-simulator"
version = "0.1.0"
description = "Predict how customer segments react to account-change notices with an AI persona panel, and flag which segments to trust using Federal Reserve survey data."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
noticesim = "noticesim.cli:main"

[tool.setuptools]
packages = ["noticesim"]

[tool.ruff]
line-length = 120
